aid: pretred
name: Pretred
description: >-
  Pretred is a Techstars-backed manufacturer of sustainable rubber safety
  barriers made from recycled waste tires, serving the infrastructure, traffic
  control, and construction sectors with a circular-economy model. Its product
  line spans the Standard Rubber Barrier, TL-2 and TL-3 crash-tested barriers,
  a Load-Rated Barrier rated for heavy machinery, and Paceline bike-lane
  barriers, each engineered for energy absorption, durability, and modularity.
  Every Pretred facility can divert over 100 million pounds of waste tires from
  landfills or incineration annually. As a physical-goods manufacturer, Pretred
  publishes no public API, developer portal, or machine-readable interface; this
  profile captures the company identity and a domain-security probe.
